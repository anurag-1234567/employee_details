<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Employee Details</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #667eea;
        }

        h1 {
            text-align: center;
            color: white;
        }

        .container {
            width: 800px;
            margin: auto;
            display: flex;
            gap: 40px;
        }

        .form-box {
            width: 350px;
            background: white;
            padding: 20px;
            border-radius: 10px;
        }

        h2 {
            text-align: center;
        }

        .form-group {
            margin-bottom: 12px;
        }

        label {
            display: block;
            margin-bottom: 5px;
        }

        input {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        .add-btn {
            width: 100%;
            padding: 9px;
            border: none;
            border-radius: 5px;
            background: #667eea;
            color: white;
        }

        .search-box {
            display: flex;
            gap: 5px;
        }

        .search-box input {
            width: 120px;
            height: 30px;
        }

        .search-box button {
            padding: 8px 15px;
            border: none;
            border-radius: 5px;
            background: #333;
            color: white;
            height: 30px;
        }

    </style>

</head>

<body>

    <h1 id="head1">Welcome</h1>

    <div class="container">

        <div class="form-box">

            <h2>Employee Details</h2>

            <div>

                <div class="form-group">
                    <label>Employee ID</label>
                    <input type="text" id="empId">
                </div>

                <div class="form-group">
                    <label>Employee Name</label>
                    <input type="text" id="empName">
                </div>

                <div class="form-group">
                    <label>Employee Address</label>
                    <input type="text" id="empAddress">
                </div>

                <div class="form-group">
                    <label>Employee Designation</label>
                    <input type="text" id="empDesignation">
                </div>

                <div class="form-group">
                    <label>Employee Experience</label>
                    <input type="number" id="empExperience">
                </div>

                <div class="form-group">
                    <label>Employee Salary</label>
                    <input type="number" id="empSalary">
                </div>

                <button onclick="addEmployee()" class="add-btn" type="button">
                    Add Employee
                </button>

            </div>

        </div>


        <div>

            <div class="search-box" id="display">

                <input type="text" id="emps" placeholder="Search ID">

                <button type="button" onclick="search()">
                    Search
                </button>

            </div>

            <div id="result"></div>

        </div>

    </div>

    <script src="employe.js"></script>

</body>

</html>
